<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuma Radar - 共存のための安全マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1>Kuma Radar 🐻</h1>
            <p>正しく恐れ、賢く避ける。</p>
        </header>

        <main>
            <div id="status-card" class="card hidden">
                <div class="status-icon">⚠️</div>
                <div class="status-content">
                    <h2 id="status-title">注意エリアです</h2>
                    <p id="status-message">近くで熊の目撃情報があります。</p>
                </div>
            </div>

            <div id="map-container">
                <div id="map"></div>
                <button id="locate-btn" aria-label="現在地を表示">
                    📍 現在地を確認
                </button>
            </div>

            <div id="info-panel">
                <h3>直近の目撃情報</h3>
                <ul id="sighting-list">
                    <!-- JSで動的に追加 -->
                </ul>
            </div>
        </main>

        <footer>
            <p>New Life Guardian Hackathon 2025</p>
            <p><small>データ出典: 長野市 令和7年度クマ目撃等情報</small></p>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
